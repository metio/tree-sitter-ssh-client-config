name: Check Upstream Options
on:
  schedule:
    - cron: 5 7 3 * *
  workflow_dispatch:
permissions:
  contents: read

jobs:
  upstream:
    name: Check Upstream Options
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install htmlq
        run: cargo install htmlq
      - name: Verify htmlq
        run: htmlq --version
      - name: Check Upstream Options
        run: make upstream
