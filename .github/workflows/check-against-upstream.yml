name: Check Upstream Options
on:
  schedule:
    - cron: 5 7 3 * *
  workflow_dispatch:
jobs:
  upstream:
    name: Check Upstream Options
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install htmlq
        run: cargo install htmlq
      - name: Verify htmlq
        run: htmlq --version
      - name: Check Upstream Options
        run: make upstream
